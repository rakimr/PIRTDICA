{% extends "base.html" %}

{% block title %}{{ error_title | default('Error') }} - PIRTDICA{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 80px auto; text-align: center; padding: 40px 20px;">
    <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
    <h1 style="color: #00ff88; font-family: 'Orbitron', sans-serif; margin-bottom: 16px;">
        {{ error_title | default('Something Went Wrong') }}
    </h1>
    <p style="color: #ccc; font-size: 16px; line-height: 1.6; margin-bottom: 30px;">
        {{ error_message | default('An unexpected error occurred. Please try again.') }}
    </p>
    <a href="/" style="display: inline-block; padding: 12px 32px; background: #00ff88; color: #000; font-weight: bold; text-decoration: none; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 14px;">
        BACK TO HOME
    </a>
</div>
{% endblock %}
